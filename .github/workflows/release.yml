name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: '更新日志（每行一条）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          RELEASE_SIGNING_CONFIG_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract Version Info
        id: version
        run: |
          # 构建时 version.properties 已自动递增，读取最终值
          VC=$(grep 'VERSION_CODE' app/version.properties | cut -d'=' -f2 | tr -d ' ')
          VN=$(grep 'VERSION_NAME' app/version.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version_code=${VC}" >> $GITHUB_OUTPUT
          echo "version_name=${VN}" >> $GITHUB_OUTPUT
          echo "Final version: code=${VC}, name=${VN}"

      - name: Upload version.properties
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: app/version.properties
          retention-days: 3

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            感谢使用正方教务助手！

            **更新日志：**
            - 自动 Release 构建版本
            - 正式签名指纹校验同步已更新
            - 开源防滥用机制保护
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
